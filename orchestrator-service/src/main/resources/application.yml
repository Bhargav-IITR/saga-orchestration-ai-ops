server:
  port: 8050

security:
  api-key: ${APP_API_KEY:}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    topic:
      start-saga: start-saga
      finish-success: finish-success
      finish-fail: finish-fail
      orchestrator: orchestrator
    consumer:
      group-id: orchestrator-group
      auto-offset-reset: latest

saga:
  timeout: ${SAGA_TIMEOUT:PT2M}
  timeout-scan-delay-ms: ${SAGA_TIMEOUT_SCAN_DELAY_MS:5000}
  timeout-batch-size: ${SAGA_TIMEOUT_BATCH_SIZE:100}

logging:
  level:
    org:
      apache:
        kafka: OFF

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
